#
# pacman.conf for Shokunin — SHIPPED INTO THE INSTALLED SYSTEM.
#
# IMPORTANT: this file's twin lives at
#   iso/profile/pacman.conf
# The two must keep the same repository ORDER and SigLevel. Drift between
# them is the single most common bug in this kind of project. If you edit
# one, edit the other. See `docs/pacman-conf-reference.md`.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10

# Default signature policy. Each repo can override.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES — order matters. First match wins on name collisions.
#

# [shokunin] — our own repo. Listed FIRST so our packages take precedence
# over anything with the same name in CachyOS or Arch (e.g. if we ship a
# `shokunin-quickshell-config` that ever collides with an AUR/Arch name).
#
# Uses Include here because the installed system has /etc/pacman.d/
# shokunin-mirrorlist (shipped by the `shokunin-mirrorlist` package).
# The build-time twin (iso/profile/pacman.conf) uses Server= direct since
# that file is not on the build host before pacstrap runs.
[shokunin]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/shokunin-mirrorlist

# [cachyos-v3] — CachyOS x86_64-v3 optimised packages.
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# [cachyos-core-v3] — v3-optimised counterpart of [core].
[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# [cachyos-extra-v3] — v3-optimised counterpart of [extra].
[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# [cachyos] — generic CachyOS repo (non-v3 fallback + CachyOS-only pkgs).
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# [core], [extra], [multilib] — upstream Arch. Listed AFTER cachyos-*-v3
# so optimised variants win on name collisions.
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
