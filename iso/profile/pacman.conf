#
# pacman.conf for Shokunin — used BY mkarchiso DURING ISO BUILD.
#
# IMPORTANT: this file's twin lives at
#   iso/profile/airootfs/etc/pacman.conf
# The two must keep the same repository ORDER and SigLevel. Drift between
# them is the single most common bug in this kind of project. See
# `docs/pacman-conf-reference.md`.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
VerbosePkgLists
DisableDownloadTimeout
ParallelDownloads = 10
DisableSandbox

# Default signature policy. Each repo can override.
# `Required` => packages must be signed by a trusted key.
# `DatabaseOptional` => DB signatures are accepted but not mandatory
#   (matches CachyOS/Arch convention; some mirrors don't sign the DB).
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES — order matters. First match wins on name collisions.
#

# [shokunin] — our own repo. Listed FIRST so our packages (branding,
# meta, configs, future overrides) take precedence over anything with
# the same name in CachyOS or Arch.
[shokunin]
SigLevel = Required DatabaseOptional
Server = https://repo.ceereals.space/shokunin/$arch

# [cachyos-v3] — CachyOS x86_64-v3 optimised packages. Provides the
# fast-path variants (kernel, mesa, etc.). Must precede plain [cachyos]
# so v3 is preferred on capable CPUs.
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# [cachyos-core-v3] — v3-optimised counterpart of [core].
[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# [cachyos-extra-v3] — v3-optimised counterpart of [extra].
[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

# [cachyos] — generic CachyOS repo (non-v3 fallback + CachyOS-only pkgs
# like the CachyOS kernel variants, paru-bin, etc.).
[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# [core] — Arch Linux core. Listed AFTER cachyos-*-v3 so the optimised
# variants win.
[core]
Include = /etc/pacman.d/mirrorlist

# [extra] — Arch Linux extra. Same reasoning as [core].
[extra]
Include = /etc/pacman.d/mirrorlist

# [multilib] — 32-bit packages, mainly for Steam / Wine.
[multilib]
Include = /etc/pacman.d/mirrorlist
