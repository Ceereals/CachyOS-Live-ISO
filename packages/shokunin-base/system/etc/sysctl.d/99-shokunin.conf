# /etc/sysctl.d/99-shokunin.conf — Shokunin kernel runtime tunables.
#
# Conservative, defensible settings only. CachyOS already tunes the
# performance side (kernel.sched_*, vm.swappiness, etc.); this file
# touches the bits CachyOS doesn't, and stays out of CachyOS's way.

# --- Inotify limits ------------------------------------------------------
# LazyVim, lazygit, fish autocompletion, file managers — they all want
# inotify watches. The kernel default (8192) runs out fast on a real
# workstation. 524288 matches the value VS Code recommends; ~64 MB RAM
# overhead at saturation, negligible on modern hardware.
fs.inotify.max_user_watches   = 524288
fs.inotify.max_user_instances = 1024

# --- File descriptor limits ---------------------------------------------
# Container workloads (podman, distrobox) and dev tools push past the
# default soft limit (1024) routinely. Raise the system-wide ceiling so
# pam_limits doesn't have to.
fs.file-max = 2097152

# --- Memory + dirty page tuning -----------------------------------------
# Smaller dirty page targets keep latency tighter when a big write
# (kernel module rebuild, IDE indexer) lands.
vm.dirty_background_ratio = 5
vm.dirty_ratio            = 15

# --- Network --- defensive defaults --------------------------------------
# Reverse-path filter on by default in strict mode — drop packets whose
# source can't be reached out the same interface (anti-spoofing).
net.ipv4.conf.all.rp_filter     = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore broadcast pings (Smurf amplification).
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses (some routers misbehave).
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Don't accept ICMP redirects (route hijacking).
net.ipv4.conf.all.accept_redirects     = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects     = 0
net.ipv6.conf.default.accept_redirects = 0

# TCP SYN cookies — defend against SYN flood (cheap, harmless).
net.ipv4.tcp_syncookies = 1

# --- SysRq ---------------------------------------------------------------
# Allow Alt+SysRq for emergency unbreak-magic (sync, remount-ro, reboot).
# 244 = enable: sync, remount-ro, signal, reboot. Excludes the dangerous
# bits (e.g. SAK, debug).
kernel.sysrq = 244

# --- Core dumps ----------------------------------------------------------
# Forward to systemd-coredump (already the default on Arch), but turn
# off the kernel.exec_path prefix so core files land in /var/lib/systemd/coredump/.
kernel.core_uses_pid = 1
