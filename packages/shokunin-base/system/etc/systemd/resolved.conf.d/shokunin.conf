# systemd-resolved drop-in for Shokunin (ADR-0014).
#
# DNS over TLS to Quad9 (privacy-friendly, malware-blocking). The
# fallback is Cloudflare (1.1.1.1). Both reachable on plain :853 TLS.
#
# Override: drop another file under /etc/systemd/resolved.conf.d/ with
# a higher lexical order, or edit this one (it's `backup=` in the
# package).
#
# Apply with:  systemctl restart systemd-resolved.service
# Verify:      resolvectl status

[Resolve]
DNS=9.9.9.9#dns.quad9.net 2620:fe::fe#dns.quad9.net
FallbackDNS=1.1.1.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com
DNSOverTLS=yes
DNSSEC=allow-downgrade
Cache=yes
DNSStubListener=yes
