# Shokunin hypridle defaults.
#
# Timeline (counts from last input event):
#   2 min   → dim the screen to 30% via brightnessctl (laptop friendly)
#   5 min   → hyprlock (screen lock)
#   10 min  → suspend (laptop only — no-op on a desktop with no power
#             button mapping)
#
# All thresholds are conservative. Tighten or relax to taste; this file
# is yours after install.
#
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle/

general {
    lock_cmd       = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

listener {
    timeout      = 120
    on-timeout   = brightnessctl -s set 30%-
    on-resume    = brightnessctl -r
}

listener {
    timeout      = 300
    on-timeout   = loginctl lock-session
}

listener {
    timeout      = 600
    on-timeout   = systemctl suspend
}
