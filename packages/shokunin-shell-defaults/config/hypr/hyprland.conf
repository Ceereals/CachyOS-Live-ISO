# Shokunin Hyprland defaults.
#
# Edit anywhere — this file lives at ~/.config/hypr/hyprland.conf after
# the first login and is yours from that moment on. Package upgrades
# never overwrite it (skel install only).
#
# Cross-references:
#   ADR-0005 — Hyprland as the compositor
#   ADR-0006 — caelestia (Quickshell) is the shell layer
#   ADR-0009 — ghostty as terminal, fish as shell
#   ADR-0010 — yazi/btop/lazygit as TUI helpers
#   ADR-0014 — hyprpolkitagent for auth, hypridle/hyprlock for lock
#   ADR-0019 — Italian keyboard layout with caps:escape
#
# Hyprland docs: https://wiki.hyprland.org/Configuring/

# ─── Monitors ────────────────────────────────────────────────────────────
# Auto-detect every connected output at its preferred mode. Override per
# monitor (e.g. `monitor = DP-1, 3840x2160@144, 0x0, 1.5`) once you know
# your layout.
monitor = , preferred, auto, 1

# ─── Environment ─────────────────────────────────────────────────────────
# Wayland + portal hints. Tells Qt, Mozilla, Electron apps to use Wayland
# natively instead of falling through XWayland.
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = MOZ_ENABLE_WAYLAND, 1
env = ELECTRON_OZONE_PLATFORM_HINT, wayland
env = GDK_BACKEND, wayland,x11
env = SDL_VIDEODRIVER, wayland

# ─── Autostart ───────────────────────────────────────────────────────────
# Shell (ADR-0006): caelestia owns the bar, notifications, OSD, launcher.
exec-once = caelestia shell

# Wallpaper daemon (ADR-0007 reads/writes this for the matugen flow).
exec-once = swww-daemon
exec-once = swww img /usr/share/backgrounds/shokunin/wallpaper.png

# Idle + lock (ADR-0014).
exec-once = hypridle

# Clipboard history daemon — backs the Mod+V picker.
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Authentication agent — without this, sudo prompts from GUI apps fail
# silently.
exec-once = systemctl --user start hyprpolkitagent

# Tell systemd which session we're in (uwsm-friendly, harmless without).
exec-once = dbus-update-activation-environment --systemd \
              WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# ─── Input ───────────────────────────────────────────────────────────────
# Italian layout with the caps:escape opinionated default (ADR-0019).
# Live changes via `hyprctl keyword input:kb_options ""` if you hate it.
input {
    kb_layout  = it
    kb_options = caps:escape

    follow_mouse = 1
    sensitivity  = 0     # -1.0 to 1.0, 0 means no acceleration

    touchpad {
        natural_scroll = true
        tap-to-click   = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true   # no-op on desktop, useful on laptop
}

# ─── General appearance ──────────────────────────────────────────────────
general {
    gaps_in  = 4
    gaps_out = 8
    border_size = 2

    # Colours are picked up from matugen via caelestia. These are
    # neutral fallbacks for the rare moment before caelestia has
    # generated anything.
    col.active_border   = rgba(7aa2f7ee)
    col.inactive_border = rgba(414868aa)

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 8

    blur {
        enabled    = true
        size       = 6
        passes     = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range   = 12
        render_power = 3
        color   = rgba(00000044)
    }
}

animations {
    enabled = true
    bezier  = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows,     1, 4, easeOutQuint, slide
    animation = windowsOut,  1, 4, easeOutQuint, slide
    animation = fade,        1, 4, easeOutQuint
    animation = workspaces,  1, 4, easeOutQuint, slide
    animation = layers,      1, 4, easeOutQuint, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo  = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr = true
}

# ─── Window rules (ADR-0005: tiling with sensible floating exceptions) ───
# Float every dialog, file picker, picture-in-picture, and the heavy
# desktop apps that need their own canvas.
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin,   title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(org.gnome.Calculator)$

# Heavyweight creative apps: floating gives them more screen real estate.
windowrulev2 = float, class:^(Blender)$
windowrulev2 = float, class:^(Gimp)$
windowrulev2 = float, class:^(krita)$

# Suppress workspace switch animation for transient dialogs.
windowrulev2 = noanim, class:^(xdg-desktop-portal-gtk)$

# ─── Layer rules ─────────────────────────────────────────────────────────
# Quickshell/caelestia layers: blur the bar and notifications.
layerrule = blur, caelestia
layerrule = blur, quickshell

# ─── Keybinds ────────────────────────────────────────────────────────────
$mod = SUPER

# Core launchers.
bind = $mod,       RETURN, exec, ghostty
bind = $mod,       B,      exec, firefox
bind = $mod,       E,      exec, ghostty -e yazi
bind = $mod,       SPACE,  exec, caelestia ipc call launcher toggle
bind = $mod,       V,      exec, cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind = $mod,       L,      exec, hyprlock

# Window control.
bind = $mod,       Q,        killactive,
bind = $mod SHIFT, Q,        exit,
bind = $mod,       F,        fullscreen, 0
bind = $mod SHIFT, F,        togglefloating,
bind = $mod,       P,        pseudo,
bind = $mod,       J,        togglesplit,

# Focus movement.
bind = $mod,       left,  movefocus, l
bind = $mod,       right, movefocus, r
bind = $mod,       up,    movefocus, u
bind = $mod,       down,  movefocus, d

# Move window within the layout.
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Mouse drag = move/resize. Standard Hyprland.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Scroll workspace switch.
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Screenshot (grimblast → satty for annotation; clipboard copy by default).
bind = ,           Print,   exec, grimblast --notify copy area
bind = SHIFT,      Print,   exec, grimblast --notify save area - | satty --filename -
bind = CTRL,       Print,   exec, grimblast --notify copy output

# Multimedia keys (laptop-friendly, no-op on a desktop without them).
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute,     exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay,        exec, playerctl play-pause
bindl = , XF86AudioNext,        exec, playerctl next
bindl = , XF86AudioPrev,        exec, playerctl previous

bindl = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
