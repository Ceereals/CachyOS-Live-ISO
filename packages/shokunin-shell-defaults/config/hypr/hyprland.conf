# Default Hyprland config for Shokunin.
#
# Goal: the absolute minimum to bring up a session and launch
# Quickshell as the shell layer on top. Keybinds, animations, decoration
# are intentionally sparse — the curated experience builds out from
# here. Omarchy's hyprland.conf is the reference for "what good looks
# like"; we'll iterate toward something similar.

# --- Monitors -----------------------------------------------------------
# `auto` lets Hyprland enumerate at native resolution. Power users override
# in ~/.config/hypr/hyprland.conf after install.
monitor = , preferred, auto, 1

# --- Autostart ----------------------------------------------------------
# Quickshell is the shell. If it crashes, restart it; do NOT fall back to
# a desktop chooser — single DE by design.
exec-once = quickshell

# Wallpaper. Path comes from shokunin-branding.
exec-once = swaybg -i /usr/share/backgrounds/shokunin/wallpaper.png -m fill

# Notification daemon, polkit agent, etc. would go here when we ship them.

# --- Input --------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# --- General appearance (placeholder defaults) --------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
}

# --- Keybinds (minimal set; expand once we know what users want) --------
$mod = SUPER

bind = $mod, RETURN, exec, kitty
bind = $mod, Q,      killactive,
bind = $mod, M,      exit,
bind = $mod, SPACE,  exec, quickshell ipc call launcher toggle
