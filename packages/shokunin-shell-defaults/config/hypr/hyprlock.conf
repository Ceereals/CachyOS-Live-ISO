# Shokunin hyprlock defaults.
#
# Minimal, fast, no surprises. The background is the desktop wallpaper
# blurred — matugen tints stay coherent.
#
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

general {
    grace = 2
    hide_cursor = true
    disable_loading_bar = true
}

background {
    monitor = ""
    path    = /usr/share/backgrounds/shokunin/wallpaper.png
    blur_passes = 3
    blur_size   = 8
    contrast    = 1.0
    brightness  = 0.6
}

input-field {
    monitor = ""
    size           = 280, 56
    position       = 0, -120
    halign         = center
    valign         = center
    outline_thickness = 2

    placeholder_text = <i>Password…</i>
    dots_center      = true
    fade_on_empty    = true
    rounding         = 12

    inner_color = rgba(20, 20, 30, 0.6)
    outer_color = rgba(122, 162, 247, 0.9)
    font_color  = rgb(220, 220, 220)
    check_color = rgba(150, 200, 100, 0.9)
    fail_color  = rgba(204, 102, 102, 0.9)
}

label {
    monitor = ""
    text    = cmd[update:1000] echo "$(date '+%H:%M')"
    color   = rgba(220, 220, 220, 0.95)
    font_size = 84
    font_family = JetBrainsMono Nerd Font
    position    = 0, 240
    halign      = center
    valign      = center
}

label {
    monitor = ""
    text    = $USER
    color   = rgba(220, 220, 220, 0.7)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position    = 0, -40
    halign      = center
    valign      = center
}
