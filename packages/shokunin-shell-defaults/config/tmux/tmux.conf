# Shokunin tmux defaults (ADR-0009).
#
# Sane keybindings, mouse on, vi-mode copy, 256-color + truecolor.
# Theme stays minimal; matugen doesn't reach into tmux, so a static
# muted scheme is fine.
#
# Docs: man tmux, https://github.com/tmux/tmux/wiki

# ─── Prefix ─────────────────────────────────────────────────────────────
# Default C-b clashes with vim-style scrollback. Move to C-a (screen-style).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── Behaviour ──────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g escape-time 10                  # vim/nvim Esc latency
set -g focus-events on
set -g base-index 1                    # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on

# Truecolor — needs ghostty/kitty/alacritty to advertise.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"

# ─── Copy mode: vi keys ─────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# ─── Pane navigation: vim-like ──────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Splits in the current directory ────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Reload config on the fly ───────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ─── Status bar: minimal ────────────────────────────────────────────────
set -g status-position top
set -g status-style "bg=default,fg=default"
set -g status-left  "#[fg=cyan,bold] #S "
set -g status-right "#[fg=yellow] %H:%M #[fg=cyan]| %d %b "
setw -g window-status-current-style "fg=cyan,bold"
setw -g window-status-current-format "  #I:#W "
setw -g window-status-format          "  #I:#W "
