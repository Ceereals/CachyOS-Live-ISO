# Calamares welcome module — Shokunin.
#
# Shown first. Pre-flight checks: enough RAM, enough disk, internet
# reachable. The user can't install without internet anyway because we
# pull packages from repo.ceereals.space + CachyOS during the run.

showSupportUrl:    true
showKnownIssuesUrl: true
showReleaseNotesUrl: true
showDonateUrl:     false

requirements:
  # Minimum 16 GiB disk — half the smallest reasonable Btrfs install.
  requiredStorage:   16
  # 2 GiB RAM is enough to install. 4+ for Hyprland to feel snappy.
  requiredRam:        2
  # Block install without internet — we depend on it for packages.
  internetCheckUrl: "https://repo.ceereals.space/"
  check:
    - storage
    - ram
    - power
    - internet
    - root
  required:
    - storage
    - ram
    - root
    - internet
