# Calamares locale module — Shokunin (ADR-0019).
#
# Defaults: Italy / Europe/Rome / it_IT.UTF-8 for region+format, but
# en_US.UTF-8 for LC_MESSAGES so error messages stay grep-able.
#
# The user can still pick anything else in the locale page; these are
# the values pre-selected on the wizard.

region: "Europe"
zone:   "Rome"

# locale.gen — both italian and US english generated so fallback works.
localeGenerator:
  - "it_IT.UTF-8 UTF-8"
  - "en_US.UTF-8 UTF-8"

# /etc/locale.conf — what the installed system reads at login.
localeConf:
  LANG:        "it_IT.UTF-8"
  LANGUAGE:    "it_IT.UTF-8"
  LC_ADDRESS:  "it_IT.UTF-8"
  LC_IDENTIFICATION: "it_IT.UTF-8"
  LC_MEASUREMENT: "it_IT.UTF-8"
  LC_MONETARY: "it_IT.UTF-8"
  LC_NAME:     "it_IT.UTF-8"
  LC_NUMERIC:  "it_IT.UTF-8"
  LC_PAPER:    "it_IT.UTF-8"
  LC_TELEPHONE: "it_IT.UTF-8"
  LC_TIME:     "it_IT.UTF-8"
  # English error messages on purpose — life is too short to Google
  # translated stack traces. (ADR-0019)
  LC_MESSAGES: "en_US.UTF-8"
