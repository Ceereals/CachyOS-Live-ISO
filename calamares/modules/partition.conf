# Calamares partition module — Shokunin (ADR-0003, ADR-0004).
#
# Pushes the Shokunin defaults: Btrfs with the openSUSE-style subvolume
# layout, LUKS2 full-disk encryption enabled by default (the user can
# still opt out in the partition page).
#
# Reference: https://github.com/calamares/calamares/blob/calamares/src/modules/partition/partition.conf

# --- Filesystem defaults -------------------------------------------------
defaultFileSystemType: "btrfs"

# Filesystems offered in the GUI. Order = display order.
availableFileSystemTypes:
  - "btrfs"
  - "ext4"
  - "xfs"
  - "f2fs"

# --- Encryption (ADR-0004) ----------------------------------------------
# Enable the encryption checkbox by default. The user can still uncheck
# it, but the default is "yes, encrypt my disk".
enableLuksAutomatedPartitioning: true
luksGeneration: "luks2"

# --- Btrfs subvolume layout (ADR-0003) ----------------------------------
# Calamares' fsconfigs entry sets up the @ / @home / @var-log / etc.
# layout at partition-creation time. snap-pac and snapper find these
# names by convention.
btrfsSubvolumes:
  - mountPoint: "/"
    subvolume: "@"
  - mountPoint: "/home"
    subvolume: "@home"
  - mountPoint: "/var/log"
    subvolume: "@var-log"
  - mountPoint: "/var/cache"
    subvolume: "@var-cache"
  - mountPoint: "/.snapshots"
    subvolume: "@.snapshots"

# --- Partition layout ----------------------------------------------------
# EFI System Partition: 1 GiB (kernel + initramfs + UKI growth headroom).
# Root: rest of the disk on Btrfs with the subvolumes above.
efiSystemPartitionSize: "1024MiB"
efiSystemPartitionName: "EFI"

# Suggested swap strategy. zram is the default on modern Linux — no
# disk swap partition needed.
neverCreateSwap: true

# --- UX --- show the user what's about to happen --------------------------
allowManualPartitioning: true
initialPartitioningChoice: erase
initialSwapChoice: "none"
