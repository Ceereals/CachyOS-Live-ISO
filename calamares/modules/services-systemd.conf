# Calamares services-systemd module — Shokunin.
#
# Enables the services that need to be active on first boot of the
# installed system. Things like Hyprland-user-session services or
# hyprpolkitagent are user-level — they're enabled by the user's
# session (hyprland.conf exec-once) and don't appear here.

# Each entry runs `systemctl enable` in the target system chroot.
# `mandatory: true` means the whole install aborts if the unit isn't
# available; `false` is best-effort.
services:
  # ─── Display manager (ADR-0008) ───────────────────────────────────────
  - name: greetd
    mandatory: true

  # ─── Security stack (ADR-0014) ────────────────────────────────────────
  - name: nftables
    mandatory: true
  - name: systemd-resolved
    mandatory: true
  - name: apparmor
    mandatory: false        # in case CachyOS kernel lacks LSM=apparmor at boot
  - name: opensnitchd
    mandatory: false        # opt-in per the ADR; user toggles via welcome
  - name: usbguard
    mandatory: false        # opt-in for laptops only

  # ─── Networking + Bluetooth + power ────────────────────────────────────
  - name: NetworkManager
    mandatory: true
  - name: bluetooth
    mandatory: false
  - name: power-profiles-daemon
    mandatory: true

  # ─── Btrfs snapshots (ADR-0003) ───────────────────────────────────────
  # snap-pac handles pre/post pacman snapshots automatically; the timers
  # below run the cleanup/rotation defined by snapper's policy.
  - name: snapper-timeline.timer
    mandatory: false
  - name: snapper-cleanup.timer
    mandatory: false

  # ─── kopia (ADR-0016) ─────────────────────────────────────────────────
  # Installed disabled — the welcome app turns it on only after the user
  # configures a repository. Keeping it out of the list here on purpose.
