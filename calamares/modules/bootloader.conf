# Calamares bootloader module — Shokunin / limine (ADR-0002).
#
# Calamares' `bootloader` module is the bootloader-agnostic entry point.
# It supports grub, systemd-boot, sb-shim, refind, and limine. Selection
# is controlled by `efiBootLoader`.
#
# Reference: https://github.com/calamares/calamares/blob/calamares/src/modules/bootloader/bootloader.conf

# EFI bootloader installed on UEFI systems.
efiBootLoader: "limine"

# Path inside the ESP where Calamares places the EFI binary. limine ships
# limine BOOT*.EFI; using a vendor subdir keeps multi-OS installs tidy.
efiBootloaderId: "Shokunin"

# Timeout for the boot menu in seconds. 5s matches limine's own default.
timeout: "5"

# Branding string shown in the boot menu entry name. limine renders
# the OS name from /etc/os-release if this is unset, but explicit is
# safer.
kernel: "/boot/vmlinuz-linux-cachyos"
initramfs: "/boot/initramfs-linux-cachyos.img"
fallback: "/boot/initramfs-linux-cachyos-fallback.img"

# Kernel cmdline. `rw` is the install-time default; everything else
# comes from the partition module's discovered UUIDs (root=UUID=...,
# resume=UUID=..., etc.) which Calamares injects automatically.
kernelParams:
  - "rw"
  - "loglevel=3"
  - "quiet"

# Install for both BIOS and UEFI when both are detected. limine
# supports both modes from the same package.
installEFIFallback: true
