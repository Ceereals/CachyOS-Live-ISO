# Calamares users module — Shokunin.
#
# Sensible defaults: the user gets wheel (sudo), audio, video, storage,
# input groups out of the box. Autologin is OFF — even on desktops the
# postura sicurezza in ADR-0014 says a password gate is the default.
#
# Reference: https://github.com/calamares/calamares/blob/calamares/src/modules/users/users.conf

defaultGroups:
  - name: "wheel"     # sudo via /etc/sudoers.d/wheel
  - name: "audio"
  - name: "video"
  - name: "input"
  - name: "storage"
  - name: "lp"        # printers
  - name: "network"

autologinGroup: "autologin"
sudoersGroup:   "wheel"

# Hostname suggestions. Calamares offers these as starting points; the
# user can override in the UI.
setHostname: EtcFile      # write to /etc/hostname
setRootPassword: false    # use sudo via wheel, no separate root password

# Username + password policy.
userShell: "/usr/bin/fish"        # ADR-0009
allowWeakPasswords: false
allowWeakPasswordsDefault: false

# Password identity: require ≥ 1 lowercase, ≥ 1 digit, ≥ 8 chars.
# Not a national-security policy — just a guardrail against "qwerty".
passwordRequirements:
  minLength: 8
  libpwquality:
    - "minlen=8"
    - "lcredit=-1"
    - "dcredit=-1"
