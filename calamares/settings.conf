# Calamares settings.conf for Shokunin.
#
# Defines: which branding to load, the module sequence the installer
# follows, and a few global tweaks. Mostly upstream defaults — the bulk
# of customisation lives in /etc/calamares/modules/<module>.conf, which
# we'll start adding once we want to diverge from defaults.
#
# Reference: https://github.com/calamares/calamares/wiki/Configure

# Where modules live. Calamares searches these directories in order.
modules-search: [ local, /usr/lib/calamares/modules ]

# The sequence is a YAML list of phases. Each phase is a list of modules
# to run in order. `show` modules render a page in the GUI; `exec`
# modules perform actual install actions.
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - initcpiocfg
      - initcpio
      # bootloader handles limine (ADR-0002) end-to-end via
      # /etc/calamares/modules/bootloader.conf. The legacy grubcfg
      # module is intentionally omitted — it edits /etc/default/grub
      # and would be a no-op for limine.
      - bootloader
      - packages
      # Enable the services needed at first boot of the installed system
      # (greetd, nftables, NetworkManager, snapper timers, ...).
      # Configured in /etc/calamares/modules/services-systemd.conf.
      - services-systemd
      - umount
  - show:
      - finished

# Which branding directory under /etc/calamares/branding/ to load. Must
# match the directory name in `calamares/branding/`.
branding: shokunin

# Show a confirmation dialog before the destructive phase. Always yes.
prompt-install: true

# Don't auto-restart at the end; let the user choose.
dont-chroot: false
