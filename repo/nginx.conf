# nginx.conf for the Shokunin pacman repo.
#
# Single responsibility: serve /srv/shokunin-repo/ as a browseable
# directory listing with the right MIME types so pacman is happy. TLS
# is terminated upstream by Traefik (see docker-compose.yml).

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # pacman fetches .db / .pkg.tar.zst with default MIME. Let octet-stream
    # be the fallback so we don't accidentally serve text/plain.
    types {
        application/x-tar           tar;
        application/zstd            zst;
        application/x-zstd          tar.zst;
        application/pgp-signature   sig;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Don't leak nginx version in headers.
    server_tokens off;

    # gzip is pointless on already-compressed package payloads. Leave off.
    gzip off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80 default_server;
        server_name _;

        root /srv/shokunin-repo;

        # Browseable index — handy for manual inspection. Off-by-default
        # for nginx; turn on explicitly.
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Cache headers: package files are immutable (version-pinned in
        # filename), so cache forever. The .db file changes; don't cache.
        location ~* \.(pkg\.tar\.zst|sig)$ {
            expires max;
            add_header Cache-Control "public, immutable";
        }

        location ~* \.(db|files)(\.tar\.gz)?$ {
            expires 5m;
            add_header Cache-Control "public, must-revalidate";
        }
    }
}
